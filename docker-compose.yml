# Local development stack (docs/DEPLOYMENT.md §2). Infrastructure only — the API runs
# on the host under `npm run start:dev` so that watch mode and the debugger work normally.
#
# Every service declares a healthcheck: `docker compose up -d --wait` then returns only
# once the stack is genuinely ready, which is what makes the NFR-OP-5 timing meaningful.
#
# Host ports are overridable. The defaults are the ones documented in DEPLOYMENT.md §2;
# a developer already running another stack on those ports sets the *_PORT variables in
# .env rather than editing this file or stopping their other project.

name: ustogo

services:
  postgres:
    image: postgres:16-alpine
    container_name: ustogo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ustogo
      POSTGRES_PASSWORD: ustogo
      POSTGRES_DB: ustogo
      # Deterministic collation: index ordering must not depend on the host locale.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ustogo -d ustogo']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: ustogo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '${MINIO_PORT:-9000}:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: the application assumes its bucket exists rather than creating it at
  # runtime, because in production the bucket is provisioned by infrastructure, not
  # by the API's credentials.
  #
  # Invoked via `docker compose run --rm` (see the stack:up script), not `up`: a
  # container that exits by design makes `up --wait` report the whole stack as failed.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ustogo-local &&
      echo 'bucket ustogo-local ready'
      "

  redis:
    image: redis:7-alpine
    container_name: ustogo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    container_name: ustogo-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP
      - '${MAILPIT_WEB_PORT:-8025}:8025' # web UI
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8025/readyz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  minio-data:
  redis-data:
